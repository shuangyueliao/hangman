function makeBag(tier) {
  var pool = [];
  return {
    draw: function () {
      if (!pool.length) { pool = []; for (var i = 0; i < TIERS[tier].length; i++) pool.push(i); }
      var k = Math.floor(Math.random() * pool.length);
      return TIERS[tier][pool.splice(k, 1)[0]];
    }
  };
}

  return pts;
}
function jitterCircle(cx, cy, r) {
  var pts = [], n = 26;
  for (var i = 0; i <= n; i++) {
    var a = (i / n) * Math.PI * 2 - Math.PI / 2, rr = r + rnd(-1.3, 1.3);
    pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
  }
  return pts;
}
// 按 progress 沿折线描画（描画动画）
function drawChalkPts(c, pts, width, alpha, progress) {
  var total = 0, segs = [], i, d;
  for (i = 1; i < pts.length; i++) {
    d = Math.sqrt((pts[i][0] - pts[i-1][0]) * (pts[i][0] - pts[i-1][0]) + (pts[i][1] - pts[i-1][1]) * (pts[i][1] - pts[i-1][1]));
    segs.push(d); total += d;
  }
  var budget = total * (progress === undefined ? 1 : Math.max(0, progress));
  c.strokeStyle = "rgba(" + CHALK + "," + alpha + ")";
  c.lineWidth = width; c.lineCap = "round"; c.lineJoin = "round";
  c.beginPath();
  c.moveTo(pts[0][0], pts[0][1]);
  var used = 0;
  for (i = 1; i < pts.length; i++) {
    var seg = segs[i - 1];
    if (used + seg <= budget) { c.lineTo(pts[i][0], pts[i][1]); used += seg; }
    else {
      var t = (budget - used) / (seg || 1);
      c.lineTo(pts[i-1][0] + (pts[i][0] - pts[i-1][0]) * t, pts[i-1][1] + (pts[i][1] - pts[i-1][1]) * t);
      break;
    }
  }
  c.stroke();
}
function strokeChalk(c, pts, progress) {
  drawChalkPts(c, pts, 3.2, 0.55, progress);
  drawChalkPts(c, pts, 5.6, 0.15, progress);
}

// 黑板底纹（离屏预渲染一次）
var off = document.createElement("canvas");
off.width = W * dpr; off.height = H * dpr;
var offCtx = off.getContext("2d");
offCtx.scale(dpr, dpr);
(function paintBoard(c) {
  c.fillStyle = "#20402f";
  c.fillRect(0, 0, W, H);
  for (var i = 0; i < 900; i++) {
    c.fillStyle = Math.random() < 0.5 ? "rgba(255,255,255,.022)" : "rgba(0,0,0,.05)";
    c.fillRect(Math.random() * W, Math.random() * H, rnd(1, 2.4), rnd(1, 2.4));
  }
  for (var s = 0; s < 14; s++) {
    c.save();
    c.translate(rnd(0, W), rnd(0, H));
    c.rotate(rnd(0, Math.PI));
    c.fillStyle = "rgba(255,255,255,.018)";
    c.beginPath();
    c.ellipse(0, 0, rnd(30, 90), rnd(8, 22), 0, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }
  var g = c.createRadialGradient(W / 2, H / 2, H / 3, W / 2, H / 2, H * 0.75);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(0,0,0,.28)");
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // 木框
  c.strokeStyle = "#6e4a2c"; c.lineWidth = 14;
  c.strokeRect(3, 3, W - 6, H - 6);
  c.strokeStyle = "rgba(255,255,255,.08)"; c.lineWidth = 1;
  c.strokeRect(10.5, 10.5, W - 21, H - 21);
})(offCtx);

// ============ 绞架与小人（6 笔 = 6 次错误） ============
var GALLOWS = [
  jitterLine(70, 310, 310, 310),   // 地面
  jitterLine(120, 310, 120, 80),   // 立柱
  jitterLine(120, 80, 250, 80),    // 横梁
  jitterLine(120, 122, 168, 80),   // 支撑
  jitterLine(250, 80, 250, 106)    // 绳子
];
function figureStrokes() {
  return [
    jitterCircle(250, 130, 22),      // 1 头
    jitterLine(250, 152, 250, 224),  // 2 身体
    jitterLine(250, 166, 218, 195),  // 3 左臂
    jitterLine(250, 166, 282, 195),  // 4 右臂
    jitterLine(250, 224, 227, 268),  // 5 左腿
    jitterLine(250, 224, 273, 268)   // 6 右腿
  ];
}
var MENUFIG = figureStrokes();
// 失败表情（装饰，不算笔画）
var FACE = [
  jitterLine(236, 120, 244, 128), jitterLine(244, 120, 236, 128),
  jitterLine(256, 120, 264, 128), jitterLine(264, 120, 256, 128),
  jitterLine(238, 150, 250, 143).concat(jitterLine(250, 143, 262, 150))
];
// 错误计分横线
var tickPts = [], tickCross = [];
(function () {
  for (var i = 0; i < 6; i++) {
    var x = 340 + i * 21;
    tickPts.push(jitterLine(x, 28, x, 46));
    tickCross.push(jitterLine(x - 6, 40, x + 6, 27));
  }
})();

// ============ 回合几何（开局生成一次） ============
var rGeo = { x0: 0, cellW: 40, gap: 9, yLine: 505 };
var underlinePts = [], chipPts = [];
function buildRoundGeometry() {
  var n = word.length;
  var cellW = Math.min(44, (W - 50) / n), gap = 9;
  var total = n * cellW + (n - 1) * gap;
  rGeo = { x0: (W - total) / 2, cellW: cellW, gap: gap, yLine: 505 };
  underlinePts = [];
  for (var i = 0; i < n; i++) {
    var x = rGeo.x0 + i * (cellW + gap);
    underlinePts.push(jitterLine(x + 3, rGeo.yLine, x + cellW - 3, rGeo.yLine));
  }
  var cw = wordCat.length * 10 + 58;
  var cx = W / 2;
  chipPts = [
    jitterLine(cx - cw / 2, 22, cx + cw / 2, 22),
    jitterLine(cx + cw / 2, 22, cx + cw / 2, 52),
    jitterLine(cx + cw / 2, 52, cx - cw / 2, 52),
    jitterLine(cx - cw / 2, 52, cx - cw / 2, 22)
  ];
}

// ============ 粉笔灰粒子 ============
var dust = [];
function spawnDust(x, y, n) {
  for (var i = 0; i < n; i++) {
    dust.push({ x: x + rnd(-7, 7), y: y + rnd(-5, 5), vx: rnd(-16, 16), vy: rnd(-46, -6), life: rnd(0.4, 0.9), s: rnd(1, 2.6) });
  }
}
function updateDust(dt) {
  for (var i = dust.length - 1; i >= 0; i--) {
    var d = dust[i];
    d.life -= dt;
    if (d.life <= 0) { dust.splice(i, 1); continue; }
    d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 140 * dt;
  }
}
function drawDust(c) {
  for (var i = 0; i < dust.length; i++) {
    var d = dust[i];
    c.globalAlpha = Math.max(0, Math.min(1, d.life));
    c.fillStyle = "rgba(" + CHALK + ",.8)";
    c.fillRect(d.x, d.y, d.s, d.s);
  }
  c.globalAlpha = 1;
}

// ============ 音效（WebAudio 合成） ============
var actx = null;
function unlockAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
  } catch (e) {}
}
function beep(freq, dur, type, gainv, delay) {
  if (muted) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    var t0 = actx.currentTime + (delay || 0);
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(gainv || 0.12, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur);
  } catch (e) {}
}
function sHit(n) { beep(523 + n * 60, 0.14, "triangle", 0.1); beep(784 + n * 60, 0.1, "sine", 0.05, 0.06); }
function sMiss() { beep(150, 0.2, "square", 0.08); beep(110, 0.25, "sawtooth", 0.06, 0.1); }
function sWin() { beep(523, 0.12, "triangle", 0.1); beep(659, 0.12, "triangle", 0.1, 0.1); beep(784, 0.16, "triangle", 0.1, 0.2); beep(1047, 0.3, "sine", 0.08, 0.32); }
function sLose() { beep(220, 0.25, "sawtooth", 0.08); beep(180, 0.25, "sawtooth", 0.08, 0.18); beep(140, 0.4, "sawtooth", 0.08, 0.36); }
function sClick() { beep(700, 0.04, "sine", 0.04); }

// ============ 屏幕键盘 ============
var keys = {};
function buildKbd() {
  keys = {};
  if (!kbdEl) return;
  kbdEl.innerHTML = "";
  var rows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
  for (var r = 0; r < rows.length; r++) {
    var row = document.createElement("div");
    row.className = "krow";
    for (var i = 0; i < rows[r].length; i++) {
      var up = rows[r].charAt(i);
      var b = document.createElement("button");
      b.className = "key";
      b.textContent = up;
      b.setAttribute("data-k", up);
      (function (low, btn) {
        btn.addEventListener("click", function () { unlockAudio(); guess(low); });
      })(up.toLowerCase(), b);
      row.appendChild(b);
      keys[up] = b;
    }
    kbdEl.appendChild(row);
  }
}
function lockKey(low, hit) {
  var b = keys[low.toUpperCase()];
  if (!b) return;
  b.disabled = true;
  b.className = "key " + (hit ? "hit" : "miss");
}

// ============ 游戏流程 ============
function updateHud() {
  scoreEl.textContent = String(score);
  streakEl.textContent = String(streak);
  bestEl.textContent = String(best);
}
function startRound(t) {
  tier = t;
  var e = bags[t].draw();
  word = e.w; wordCat = CATS[e.c] || e.c.toUpperCase(); wordGloss = e.g;
  revealed = []; missedReveal = [];
  for (var i = 0; i < word.length; i++) { revealed.push({ on: false, rot: rnd(-0.06, 0.06) }); missedReveal.push(false); }
  guessed = {}; misses = 0;
  buildRoundGeometry();
  buildKbd();
  state = "PLAY";
  overlay.style.display = "none";
}
function startRun(t) {
  score = 0; streak = 0; lastGain = 0;
  bestAtRunStart = best; newBestRun = false; runActive = true;
  lastTier = t;
  updateHud();
  startRound(t);
  // 平台埋点：一局开始
  try {
    if (window.__portal === "crazygames" && window.CrazyGames && window.CrazyGames.SDK) {
      window.CrazyGames.SDK.game.gameplayStart();
    }
  } catch (e) {}
}
function allRevealed() {
  for (var i = 0; i < revealed.length; i++) if (!revealed[i].on) return false;
  return true;
}
function winWord() {
  var base = (6 - misses) * 100 + word.length * 20;
  streak++;
  var mult = streak >= 3 ? 1.5 : 1;
  lastGain = Math.round(base * mult);
  score += lastGain;
  if (streak > bestStreak) { bestStreak = streak; try { localStorage.setItem("wg_streak", String(bestStreak)); } catch (e) {} }
  if (score > best) { best = score; try { localStorage.setItem("wg_best", String(best)); } catch (e) {} }
  updateHud();
  state = "WON";
  showWin();
  sWin();
}
function endRun() {
  if (!runActive) return;
  runActive = false;
  newBestRun = score > bestAtRunStart && score > 0;
  if (score > best) { best = score; try { localStorage.setItem("wg_best", String(best)); } catch (e) {} }
  streak = 0;
  updateHud();
  // 平台埋点：一局结束
  try {
    if (window.__portal === "crazygames" && window.CrazyGames && window.CrazyGames.SDK) {
      window.CrazyGames.SDK.game.gameplayStop();
      if (newBestRun) window.CrazyGames.SDK.game.happytime();
    }
  } catch (e) {}
}
function loseWord() {
  for (var i = 0; i < word.length; i++) {
    if (!revealed[i].on) { revealed[i].on = true; missedReveal[i] = true; }
  }
  loseT = now();
  state = "LOST";
  endRun();
  showLose();
  sLose();
}
function guess(ch) {
  if (state !== "PLAY") return false;
  ch = String(ch).toLowerCase();
  if (!/^[a-z]$/.test(ch)) return false;
  if (guessed[ch]) return false;           // 重复猜同一字母：忽略
  guessed[ch] = true;
  var hit = false, cnt = 0, i;
  for (i = 0; i < word.length; i++) {
    if (word.charAt(i) === ch) { revealed[i].on = true; hit = true; cnt++; }
  }
  if (hit) {
    lockKey(ch, true);
    for (i = 0; i < revealed.length; i++) {
      if (revealed[i].on && word.charAt(i) === ch) {
        spawnDust(rGeo.x0 + i * (rGeo.cellW + rGeo.gap) + rGeo.cellW / 2, rGeo.yLine - 10, 4);
      }
    }
    sHit(cnt);
    if (allRevealed()) winWord();
  } else {
    lockKey(ch, false);
    misses++;
    var pts = figureStrokes()[misses - 1];
    strokes.push({ pts: pts, t0: now() });
    var tail = pts[pts.length - 1];
    spawnDust(tail[0], tail[1], 8);
    sMiss();
    if (misses >= 6) loseWord();
  }
  return hit;
}

// ============ 覆盖层面板 ============
function showMenu() {
  state = "MENU";
  overlay.style.display = "flex";
  panel.innerHTML =
    '<h2>WORD GALLOWS</h2>' +
    '<p>Guess the hidden word letter by letter.<br>Six wrong guesses and the chalk figure is finished.</p>' +
    '<button class="big" data-action="start" data-tier="0">EASY &middot; 4&ndash;5 LETTERS</button>' +
    '<button class="big" data-action="start" data-tier="1">MEDIUM &middot; 6&ndash;8 LETTERS</button>' +
    '<button class="big" data-action="start" data-tier="2">HARD &middot; 9&ndash;12 LETTERS</button>' +
    '<p class="mini">BEST RUN ' + best + ' &middot; LONGEST STREAK ' + bestStreak + '</p>';
}
function showWin() {
  overlay.style.display = "flex";
  panel.innerHTML =
    '<h2>CORRECT!</h2>' +
    '<p class="wordLine">' + word.toUpperCase() + ' <span class="cat">&middot; ' + wordCat + '</span></p>' +
    '<p class="gloss">' + wordGloss + '</p>' +
    '<div class="final">+' + lastGain + '</div>' +
    '<p class="mini">' + (streak >= 3 ? 'STREAK ' + streak + ' &mdash; SCORE &times;1.5' : 'STREAK ' + streak) + '</p>' +
    '<button class="big" data-action="next">NEXT WORD</button>';
}
function showLose() {
  overlay.style.display = "flex";
  panel.innerHTML =
    '<h2>GAME OVER</h2>' +
    '<p class="wordLine">The word was ' + word.toUpperCase() + ' <span class="cat">&middot; ' + wordCat + '</span></p>' +
    '<p class="gloss">' + wordGloss + '</p>' +
    '<div class="final">' + score + '</div>' +
    '<p class="mini">' + (newBestRun ? 'NEW BEST RUN!' : 'BEST RUN ' + best) + '</p>' +
    '<button class="big" data-action="again">PLAY AGAIN</button>' +
    '<button class="big" data-action="menu">MENU</button>';
}
overlay.addEventListener("click", function (e) {
  var el = e.target;
  while (el && el !== overlay && !(el.getAttribute && el.getAttribute("data-action"))) el = el.parentNode;
  if (!el || el === overlay) return;
  unlockAudio();
  var act = el.getAttribute("data-action");
  var t = parseInt(el.getAttribute("data-tier") || "0", 10);
  if (act === "start") startRun(t);
  else if (act === "next") startRound(tier);
  else if (act === "again") startRun(tier);
  else if (act === "menu") showMenu();
});
menuBtn.addEventListener("click", function () {
  sClick();
  if (state === "PLAY" || state === "WON") endRun();
  showMenu();
});
function toggleMute() {
  muted = !muted;
  try { localStorage.setItem("wg_mute", muted ? "1" : "0"); } catch (e) {}
  muteBtn.textContent = muted ? "SOUND OFF" : "SOUND ON";
  if (!muted) { unlockAudio(); sClick(); }
}
muteBtn.addEventListener("click", toggleMute);
muteBtn.textContent = muted ? "SOUND OFF" : "SOUND ON";

// 桌面键盘 A-Z + Enter
document.addEventListener("keydown", function (e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key && e.key.length === 1 && /[a-zA-Z]/.test(e.key)) {
    if (state === "PLAY") { e.preventDefault(); guess(e.key); }
  } else if (e.key === "Enter") {
    if (state === "MENU") { unlockAudio(); startRun(lastTier); }
    else if (state === "WON") startRound(tier);
    else if (state === "LOST") startRun(tier);
  }
});
// 触屏：阻止画布上的默认手势
canvas.addEventListener("touchstart", function (e) { e.preventDefault(); }, { passive: false });
canvas.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

// ============ 渲染 ============
var strokes = [];   // 已画出的笔画 {pts, t0}
function render(t) {
  ctx.drawImage(off, 0, 0, W, H);
  var c = ctx, i;
  if (state === "MENU") {
    for (i = 0; i < GALLOWS.length; i++) strokeChalk(c, GALLOWS[i]);
    for (i = 0; i < MENUFIG.length; i++) strokeChalk(c, MENUFIG[i]);
    drawDust(c);
    return;
  }
  // 提示框
  for (i = 0; i < chipPts.length; i++) strokeChalk(c, chipPts[i]);
  c.fillStyle = "rgba(" + CHALK + ",.85)";
  c.font = "13px Georgia, serif";
  c.textAlign = "center"; c.textBaseline = "alphabetic";
  c.fillText("HINT: " + wordCat, W / 2, 41);
  // 错误计数
  c.textAlign = "left";
  c.fillText("MISSES " + misses + "/6", 26, 41);
  for (i = 0; i < 6; i++) {
    strokeChalk(c, tickPts[i]);
    if (i < misses) strokeChalk(c, tickCross[i]);
  }
  // 连胜加成提示
  if (streak >= 3) {
    c.fillStyle = "rgba(240,220,130,.9)";
    c.textAlign = "center";
    c.fillText("STREAK x1.5 ACTIVE", W / 2, 68);
  }
  // 绞架
  for (i = 0; i < GALLOWS.length; i++) strokeChalk(c, GALLOWS[i]);
  // 小人（描画动画）
  for (i = 0; i < strokes.length; i++) {
    var p = Math.min(1, (t - strokes[i].t0) / 480);
    strokeChalk(c, strokes[i].pts, p);
  }
  // 失败表情
  if (state === "LOST") {
    var fp = Math.min(1, (t - loseT) / 300);
    for (i = 0; i < FACE.length; i++) strokeChalk(c, FACE[i], fp);
  }
  // 单词下划线格与字母
  var n = word.length;
  for (i = 0; i < n; i++) {
    strokeChalk(c, underlinePts[i]);
    if (revealed[i].on) {
      var cx = rGeo.x0 + i * (rGeo.cellW + rGeo.gap) + rGeo.cellW / 2;
      c.save();
      c.translate(cx, rGeo.yLine - 12);
      c.rotate(revealed[i].rot);
      c.fillStyle = missedReveal[i] ? "rgba(235,160,150,.95)" : "rgba(" + CHALK + ",.95)";
      c.font = "700 " + Math.round(rGeo.cellW * 0.72) + "px Georgia, serif";
      c.textAlign = "center"; c.textBaseline = "alphabetic";
      c.fillText(word.charAt(i).toUpperCase(), 0, 0);
      c.restore();
    }
  }
  drawDust(c);
}
var last = 0;
function frame(t) {
  var dt = Math.min((t - last) / 1000, 0.05);
  last = t;
  updateDust(dt);
  render(t);
  requestAnimationFrame(frame);
}

// ============ 启动 ============
buildKbd();
updateHud();
showMenu();
requestAnimationFrame(frame);

// 调试/测试钩子（不影响游戏逻辑）
window.__wg = {
  guess: guess, startRun: startRun, startRound: startRound, endRun: endRun, showMenu: showMenu, toggleMute: toggleMute,
  get state() { return state; }, get score() { return score; }, get streak() { return streak; },
  get misses() { return misses; }, get word() { return word; }, get guessed() { return guessed; },
  get best() { return best; }, get bestStreak() { return bestStreak; },
  get TIERS() { return TIERS; }, get CATS() { return CATS; }
};
</script>
